version: '3.9'

# ===== Senflare-IP 开箱即用部署 =====
# 镜像已内置 IPtest.py、entrypoint.sh 和默认 config.json，pull 后直接 up 即可运行。
#
# 自定义配置（三选一，优先级：环境变量 > config.json）：
#   1. 下方 environment 直接写死（env 方式）
#   2. 修改本地 config.json 的 env 区块，并取消 volumes 中 config 挂载的注释
#   3. 通过环境变量 CONFIG_FILE 指定其他路径的配置文件
#
# 结果输出：取消 output 挂载注释后，运行结果（txt/json/log）会同步到宿主 ./output 目录

services:
  senflare-ip:
    image: "allurelove98/senflare-ip:latest"
    container_name: senflare-ip
    restart: unless-stopped
    working_dir: /app
    volumes:
      # 可选：自定义配置（取消注释并使用本地 config.json 覆盖镜像默认配置）
      # - ./config.json:/app/config.json:ro
      # 可选：输出目录（运行结果同步到宿主机）
      # - ./output:/app/output

    environment:
      TZ: Asia/Shanghai
      # 可选：自定义配置文件路径（指向容器内路径）
      # CONFIG_FILE: /app/config.json
      # 运行参数也可写在 config.json 的 env 区块（env 方式二选一，环境变量优先）
      # 运行间隔（秒），默认 10800（3小时）
      RUN_INTERVAL_SECONDS: "${RUN_INTERVAL_SECONDS:-10800}"
      GIT_PUSH_ENABLED: "${GIT_PUSH_ENABLED:-false}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REPOSITORY: "${GITHUB_REPOSITORY:-}"
      GIT_USER_NAME: "${GIT_USER_NAME:-GitHub Action}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:-action@github.com}"
      COMMIT_MESSAGE: "${COMMIT_MESSAGE:-Update IP results}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      ALL_PROXY: "${ALL_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"

    networks:
      VBR-LAN2-vlan:
        ipv4_address: 10.0.240.1


networks:
  VBR-LAN2-vlan:
    external: true