version: '3.9'

# ===== Senflare-IP 部署 =====
# 配置只有两个来源，分工明确：
#   1. config.json —— 全部运行参数（ip_sources、test_ports、超时、LOG_LEVEL、代理等）
#      挂载到容器 /app/config.json（:ro 只读保护）。镜像不内置配置，缺失会启动报错。
#   2. environment —— 只放机密（GITHUB_TOKEN 等），避免写进 config.json 提交到仓库。
#      ⚠️ 其余运行参数一律交给 config.json 的 env 区块：这里写任何默认值都会覆盖它。

services:
  senflare-ip:
    image: "allurelove98/senflare-ip:latest"
    container_name: senflare-ip
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./config.json:/app/config.json:ro
      # 可选：输出目录（运行结果同步到宿主机）
      # - ./output:/app/output

    environment:
      TZ: Asia/Shanghai
      # 机密：从宿主机 .env / shell 注入（留空则由 config.json 的 env 区块兜底）
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # 其余参数（LOG_LEVEL、RUN_INTERVAL_SECONDS、HTTP_PROXY 等）全部写在 config.json 的 env 区块

    networks:
      VBR-LAN2-vlan:
        ipv4_address: 10.0.240.1


networks:
  VBR-LAN2-vlan:
    external: true